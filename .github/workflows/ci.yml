name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: TypeScript Type Checking
        run: npx tsc --noEmit -p backend/tsconfig.json
      - name: ESLint
        run: npm run lint

  openapi:
    name: OpenAPI Validation
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Validate OpenAPI
        run: npm run openapi:validate -w backend

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: NPM Audit
        run: npm audit --audit-level=high

  build:
    name: Build Packages
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate --schema=database/prisma/schema.prisma
      - name: Cache Prisma Client
        uses: actions/cache@v4
        with:
          path: node_modules/.prisma
          key: ${{ runner.os }}-prisma-${{ hashFiles('database/prisma/schema.prisma') }}
      - name: Build
        run: npm run build

  tests:
    name: Tests (Unit, Integration, Concurrency)
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: djs
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate --schema=database/prisma/schema.prisma
      - name: Run Database Migrations
        run: npx prisma migrate deploy --schema=database/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/djs?schema=public
      - name: Unit Tests
        run: npm run test:unit -w backend
      - name: Integration Tests
        run: npm run test:integration -w backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/djs?schema=public
          REDIS_URL: redis://localhost:6379
      - name: Concurrency Tests
        run: npm run test:concurrency -w backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/djs?schema=public
          REDIS_URL: redis://localhost:6379
      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: backend/coverage/

  docker-smoke:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [lint, openapi, security, tests]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker compose -f docker-compose.smoke.yml build
      - name: Docker Compose Up
        run: docker compose -f docker-compose.smoke.yml up -d
      - name: Wait for Health Checks
        run: |
          echo "Waiting for services to become healthy..."
          sleep 15
      - name: K6 Smoke Test
        run: npm run load:smoke -w backend
      - name: Capture Logs & Benchmarks
        if: always()
        run: |
          docker compose -f docker-compose.smoke.yml logs > docker-compose-smoke.log
      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: |
            docker-compose-smoke.log
            backend/test/load/*.json
      - name: Docker Compose Down
        if: always()
        run: docker compose -f docker-compose.smoke.yml down

  release-summary:
    name: Generate Release Summary
    runs-on: ubuntu-latest
    needs: [docker-smoke]
    steps:
      - name: Print Summary
        run: |
          echo "## Backend Build :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "✅ Lint" >> $GITHUB_STEP_SUMMARY
          echo "✅ Types" >> $GITHUB_STEP_SUMMARY
          echo "✅ Prisma" >> $GITHUB_STEP_SUMMARY
          echo "✅ Unit Tests" >> $GITHUB_STEP_SUMMARY
          echo "✅ Integration Tests" >> $GITHUB_STEP_SUMMARY
          echo "✅ Concurrency Tests" >> $GITHUB_STEP_SUMMARY
          echo "✅ Docker" >> $GITHUB_STEP_SUMMARY
          echo "✅ Smoke Test" >> $GITHUB_STEP_SUMMARY
          echo "✅ OpenAPI" >> $GITHUB_STEP_SUMMARY
          echo "✅ Security" >> $GITHUB_STEP_SUMMARY

