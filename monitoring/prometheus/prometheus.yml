global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "djs-api"
    static_configs:
      - targets: ["api:3000"]

  - job_name: "djs-scheduler"
    static_configs:
      - targets: ["scheduler:3001"]

  - job_name: "djs-worker"
    static_configs:
      - targets: ["worker:3002"]
