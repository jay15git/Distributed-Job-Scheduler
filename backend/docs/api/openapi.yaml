openapi: 3.1.0
info:
  title: Distributed Job Scheduler API
  description: High-performance, multi-tenant distributed job processing platform.
  version: 1.0.0
  license:
    name: MIT
servers:
  - url: /api/v1
    description: Base API URL
paths:
  /health/live:
    get:
      operationId: checkLiveness
      summary: Liveness Probe
      description: Check if the application is running
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          description: Bad Request
  /health/ready:
    get:
      operationId: checkReadiness
      summary: Readiness Probe
      description: Check if the application is ready to receive traffic (DB/Redis checks)
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          description: Bad Request
        '503':
          description: Service Unavailable

  /auth/register:
    post:
      operationId: registerUser
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error

  /auth/login:
    post:
      operationId: loginUser
      summary: Login to account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
        '401':
          description: Invalid credentials
        '429':
          description: Too many failed attempts (Lockout)

  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Refresh access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New tokens generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
        '401':
          description: Invalid or expired refresh token

  /auth/logout:
    post:
      operationId: logoutUser
      summary: Logout of current session
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully
        '401':
          description: Unauthorized

  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized

  /organizations:
    post:
      operationId: createOrganization
      summary: Create Organization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationCreateRequest'
      responses:
        '201':
          description: Organization created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
    get:
      operationId: listOrganizations
      summary: List Organizations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
        '401':
          description: Unauthorized
          
  /organizations/{id}:
    get:
      operationId: getOrganization
      summary: Get Organization
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Organization details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          description: Unauthorized
        '404':
          description: Not found

  /projects:
    post:
      operationId: createProject
      summary: Create Project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
    get:
      operationId: listProjects
      summary: List Projects
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A list of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          description: Unauthorized
        '400':
          description: Bad Request (missing organizationId)
          
  /projects/{id}:
    get:
      operationId: getProject
      summary: Get Project
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          description: Unauthorized
        '404':
          description: Not found

  /queues:
    post:
      operationId: createQueue
      summary: Create Queue
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueCreateRequest'
      responses:
        '201':
          description: Queue created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queue'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
    get:
      operationId: listQueues
      summary: List Queues
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A list of queues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Queue'
        '401':
          description: Unauthorized
        '400':
          description: Bad Request (missing projectId)
          
  /queues/{id}:
    get:
      operationId: getQueue
      summary: Get Queue
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Queue details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queue'
        '401':
          description: Unauthorized
        '404':
          description: Not found

  /jobs:
    post:
      operationId: createJob
      summary: Enqueue Job
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreateRequest'
      responses:
        '201':
          description: Job Enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
    get:
      operationId: listJobs
      summary: List Jobs
      security:
        - bearerAuth: []
      parameters:
        - name: queueId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A list of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
        '401':
          description: Unauthorized
        '400':
          description: Bad Request (missing queueId)
          
  /jobs/{id}:
    get:
      operationId: getJob
      summary: Get Job
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          description: Unauthorized
        '404':
          description: Not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok

    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: StrongPass1!
        name:
          type: string
          example: John Doe
    
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: StrongPass1!
        deviceName:
          type: string
          example: Chrome Windows

    RefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          example: eyJ...
        deviceName:
          type: string
          example: Chrome Windows

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJ...
        refreshToken:
          type: string
          example: eyJ...
        user:
          $ref: '#/components/schemas/User'
    
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        isEmailVerified:
          type: boolean
          
    OrganizationCreateRequest:
      type: object
      required:
        - name
        - slug
      properties:
        name:
          type: string
          example: Acme Corp
        slug:
          type: string
          example: acme-corp
          
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        createdAt:
          type: string
          format: date-time
          
    ProjectCreateRequest:
      type: object
      required:
        - organizationId
        - name
        - slug
      properties:
        organizationId:
          type: string
          format: uuid
        name:
          type: string
          example: Marketing Backend
        slug:
          type: string
          example: marketing-backend

    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        createdAt:
          type: string
          format: date-time
          
    QueueCreateRequest:
      type: object
      required:
        - projectId
        - name
      properties:
        projectId:
          type: string
          format: uuid
        name:
          type: string
          example: emails
        configuration:
          type: object
          properties:
            concurrencyLimit:
              type: integer
              example: 10

    Queue:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          example: ACTIVE
        createdAt:
          type: string
          format: date-time
          
    JobCreateRequest:
      type: object
      required:
        - queueId
        - type
        - payload
      properties:
        queueId:
          type: string
          format: uuid
        type:
          type: string
          example: send_email
        payload:
          type: object
          example: { "to": "user@example.com", "subject": "Welcome" }
        priority:
          type: integer
          example: 1

    Job:
      type: object
      properties:
        id:
          type: string
          format: uuid
        queueId:
          type: string
          format: uuid
        type:
          type: string
        payload:
          type: object
        priority:
          type: integer
        status:
          type: string
          example: QUEUED
        createdAt:
          type: string
          format: date-time
