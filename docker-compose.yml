version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: djs-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: djs
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d djs"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - djs_network

  redis:
    image: redis:7-alpine
    container_name: djs-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - djs_network

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: djs-migrate
    environment:
      - ROLE=migrate
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/djs?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - djs_network

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: djs-api
    environment:
      - ROLE=api
      - EMAIL_MODE=dev
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/djs?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=supersecret_change_me_in_production
      - JWT_REFRESH_SECRET=supersecret_refresh_change_me_in_production
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/v1/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - djs_network

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: djs-scheduler
    environment:
      - ROLE=scheduler
      - HEALTH_PORT=3001
      - EMAIL_MODE=dev
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/djs?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=supersecret_change_me_in_production
      - JWT_REFRESH_SECRET=supersecret_refresh_change_me_in_production
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - djs_network

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - ROLE=worker
      - HEALTH_PORT=3002
      - EMAIL_MODE=dev
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/djs?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=supersecret_change_me_in_production
      - JWT_REFRESH_SECRET=supersecret_refresh_change_me_in_production
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3002/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - djs_network

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: djs-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - djs_network

  grafana:
    image: grafana/grafana:10.0.3
    container_name: djs-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - djs_network

volumes:
  pgdata:
  prometheus_data:
  grafana_data:

networks:
  djs_network:
    driver: bridge
